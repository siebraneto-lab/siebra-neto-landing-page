name: Sincronizar lançamentos do Spotify
on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas
  workflow_dispatch: {}      # botão "Run workflow" para rodar na hora
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Buscar lançamentos no Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python scripts/sync_spotify.py
      - name: Salvar se houve mudança
        run: |
          git config user.name "spotify-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add releases.json
          git diff --staged --quiet || (git commit -m "chore: atualiza lançamentos do Spotify" && git push)
